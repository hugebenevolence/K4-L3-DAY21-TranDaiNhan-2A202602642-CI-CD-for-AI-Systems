name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/*.dvc'
      - 'src/*.py'
      - 'tests/*.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Authenticate to S3
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Pull versioned training data
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        run: python src/train.py
      - name: Read report
        id: read_report
        shell: bash
        run: echo "f1=$(python -c 'import json; print(json.load(open("outputs/report.json"))["f1_score"])')" >> "$GITHUB_OUTPUT"
      - name: Save training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/model.joblib
            outputs/report.json

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Require positive-class F1 >= 0.65
        env:
          F1_SCORE: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PY'
          import os
          f1 = float(os.environ['F1_SCORE'])
          if f1 < 0.65:
              raise SystemExit(f'FAILED: f1_score {f1:.4f} < 0.65. Release blocked.')
          print(f'PASSED: f1_score {f1:.4f} >= 0.65')
          PY

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trained-model
      - name: Authenticate to S3
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Publish approved model and report
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          aws s3 cp models/model.joblib "s3://$ARTIFACT_BUCKET/artifacts/current/model.joblib"
          aws s3 cp outputs/report.json "s3://$ARTIFACT_BUCKET/artifacts/current/report.json"
      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}
      - name: Deploy and check API
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          ssh "$SERVER_USER@$SERVER_HOST" 'mkdir -p ~/src'
          scp src/serve.py "$SERVER_USER@$SERVER_HOST:~/src/serve.py"
          ssh "$SERVER_USER@$SERVER_HOST" 'sudo systemctl restart income-api'
          for attempt in {1..12}; do
            if curl --fail --silent "http://$SERVER_HOST:8080/healthz"; then
              echo 'API health check passed.'
              exit 0
            fi
            sleep 5
          done
          exit 1
